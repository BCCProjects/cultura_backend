services:
  db:
    image: postgres:15
    container_name: culturalocal_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: culturalocal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: culturalocal_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app               # código montado para hot-reload em dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate --noinput --fake-initial && \
             python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata: